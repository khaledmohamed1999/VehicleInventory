<section class="vehicle-form">
  <header class="vehicle-form__header">
    <h1>{{ isEditMode ? 'Edit vehicle' : 'Add vehicle' }}</h1>
  </header>

  @if (errorMessage) {
    <p class="vehicle-form__error">{{ errorMessage }}</p>
  }

  <form [formGroup]="form" (ngSubmit)="submit()" class="vehicle-form__grid">
    <label class="field">
      <span>License plate</span>
      <input
        type="text"
        formControlName="licensePlate"
        placeholder="ABC-1234"
        [class.field--invalid]="form.controls.licensePlate.invalid && form.controls.licensePlate.touched"
      />
      @if (form.controls.licensePlate.invalid && form.controls.licensePlate.touched) {
        <small class="field__error">License plate is required (max 20 characters).</small>
      }
    </label>

    <label class="field">
      <span>Driver</span>
      <select formControlName="driverId">
        <option [ngValue]="null">No driver assigned</option>
        @for (driver of drivers; track driver.id) {
          <option [ngValue]="driver.id">{{ driver.name }}</option>
        }
      </select>
    </label>

    <label class="field">
      <span>Model</span>
      <input 
        type="text" 
        formControlName="model" 
        placeholder="FH16"
        [class.field--invalid]="form.controls.model.invalid && form.controls.model.touched" 
      />
      @if (form.controls.model.invalid && form.controls.model.touched) {
        <small class="field__error">Please enter a model for the vehicle.</small>
      }
    </label>

    <label class="field">
      <span>Year</span>
      <input
        type="number"
        formControlName="year"
        [class.field--invalid]="form.controls.year.invalid && form.controls.year.touched"
      />
      @if (form.controls.year.invalid && form.controls.year.touched) {
        <small class="field__error">Enter a year between 1980 and 2100.</small>
      }
    </label>

    <label class="field">
      <span>Mileage (km)</span>
      <input
        type="number"
        formControlName="mileage"
        [class.field--invalid]="form.controls.mileage.invalid && form.controls.mileage.touched"
      />
      @if (form.controls.mileage.invalid && form.controls.mileage.touched) {
        <small class="field__error">Mileage must be 0 or greater.</small>
      }
    </label>

    <label class="field">
      <span>Type</span>
      <select formControlName="type">
        @for (type of vehicleTypes; track type) {
          <option [value]="type">{{ type }}</option>
        }
      </select>
    </label>

    <label class="field">
      <span>Status</span>
      <select formControlName="status">
        @for (status of vehicleStatuses; track status) {
          <option [value]="status">{{ status | splitPascalCase }}</option>
        }
      </select>
    </label>

    <div class="vehicle-form__actions">
      <a class="btn" routerLink="/vehicles">Cancel</a>
      <button type="submit" class="btn btn--primary" [disabled]="isSaving">
        {{ isSaving ? 'Saving...' : 'Save vehicle' }}
      </button>
    </div>
  </form>
</section>
