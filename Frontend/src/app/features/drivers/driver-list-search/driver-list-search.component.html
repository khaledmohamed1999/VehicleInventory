<section class="driver-list">
  <div class="driver-grid">
    @for (driver of drivers; track driver.id) {
      <article class="driver-card">
        <div class="driver-card__top">
          <h2>{{ driver.name }}</h2>
          <span class="badge badge--active">{{ driver.level }}</span>
        </div>

        <dl class="driver-card__details">
          <div><dt>Phone</dt><dd>{{ driver.phone || '—' }}</dd></div>
          <div><dt>Date of birth</dt><dd>{{ driver.dob | date: 'mediumDate' }}</dd></div>
        </dl>

        <div class="driver-card__actions">
          <a class="btn btn--small" [routerLink]="['/drivers', driver.id, 'edit']">Edit</a>
          <button class="btn btn--small btn--danger" (click)="deleteDriver(driver)">Delete</button>
        </div>
      </article>
    }
  </div>
</section>
