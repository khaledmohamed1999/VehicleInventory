<section class="driver-form">
  <header class="driver-form__header">
    <h1>{{ isEditMode ? 'Edit driver' : 'Add driver' }}</h1>
  </header>

  @if (errorMessage) {
    <p class="driver-form__error">{{ errorMessage }}</p>
  }

  <form [formGroup]="form" (ngSubmit)="submit()" class="driver-form__grid">
    <label class="field">
      <span>Name</span>
      <input
        type="text"
        formControlName="name"
        placeholder="Jane Doe"
        [class.field--invalid]="form.controls.name.invalid && form.controls.name.touched"
      />
      @if (form.controls.name.invalid && form.controls.name.touched) {
        <small class="field__error">Name is required.</small>
      }
    </label>

    <label class="field">
      <span>Phone</span>
      <input
        type="text"
        formControlName="phone"
        placeholder="+45 12 34 56 78"
        [class.field--invalid]="form.controls.phone.invalid && form.controls.phone.touched"
      />
      @if (form.controls.phone.invalid && form.controls.phone.touched) {
        <small class="field__error">Phone is required (max 20 characters).</small>
      }
    </label>

    <label class="field">
      <span>Date of birth</span>
      <input
        type="date"
        formControlName="dob"
        [class.field--invalid]="form.controls.dob.invalid && form.controls.dob.touched"
      />
      @if (form.controls.dob.invalid && form.controls.dob.touched) {
        <small class="field__error">Date of birth is required.</small>
      }
    </label>

    <label class="field">
      <span>Level</span>
      <select formControlName="level">
        @for (level of driverLevels; track level) {
          <option [value]="level">{{ level }}</option>
        }
      </select>
    </label>

    <div class="driver-form__actions">
      <a class="btn" routerLink="/drivers">Cancel</a>
      <button type="submit" class="btn btn--primary" [disabled]="isSaving">
        {{ isSaving ? 'Saving...' : 'Save driver' }}
      </button>
    </div>
  </form>
</section>
